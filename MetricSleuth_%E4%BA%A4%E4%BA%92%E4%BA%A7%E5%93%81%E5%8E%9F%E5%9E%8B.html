le">最近的调查</div><section class="card"><div class="record-row" data-go="investigation"><div class="record-icon">${I('search')}</div><div class="record-main"><strong>${p.title}</strong><small>指标检查 · 来自${s.scenario==='normal'?'例行检查':'业务异常'} · 本地原型</small></div><div class="record-right">${pill(s.run==='done'?'已完成':s.run==='running'?'调查中':'待调查',s.run==='done'?'green':s.run==='running'?'blue':'amber')}<small>当前场景</small></div>${I('arrow',16)}</div><div class="record-row" data-go="investigation" data-case="1"><div class="record-icon">${I('file')}</div><div class="record-main"><strong>历史任务：店铺经营周度检查</strong><small>历史示例记录 · 仅展示界面结构</small></div><div class="record-right">${pill('已归档','neutral')}<small>示例</small></div>${I('arrow',16)}</div></section>`}

led':''}/><div class="chat-foot"><button class="btn small light" data-act="quickask" ${s.run!=='done'?'disabled':''}>为什么排除其他因素？</button><div class="spacer"></div><button class="btn small primary" data-act="ask" ${s.run!=='done'?'disabled':''}>${I('send',14)} 发送</button></div><div class="micro muted" style="margin-top:10px">当前为预设回答演示；正式产品需要连接 Agent 会话。</div></div></section></div><aside style="display:grid;gap:18px;align-content:start"><section class="card"><div class="card-head"><h3>调查过程</h3><span class="small muted">${s.progress} / ${p.steps.length}</span></div><div class="card-body">${traceHtml()}</div></section><section class="card"><div class="card-head"><h3>本次运行</h3></div><div class="card-body" style="padding-top:17px"><div class="meta-line"><span>运行模式</span><b>前端模拟流程</b></div><div class="mini-line"></div><div class="meta-line"><span>决策模型</span><b>示例逻辑（非 Jev）</b></div><div class="mini-line"></div><div class="meta-line"><span>实际工具调用</span><b>0 次</b></div><div class="mini-line"></div><div class="meta-line"><span>后端连接</span><b>未连接</b></div></div></section></aside></div>`}
function dataView(){return `<div class="page-head"><div><div class="eyebrow">DATA CONNECTIONS</div><h2>数据接入</h2><p>这里是系统如何获取真实数据的设计位置，也是区分“演示效果”和“真实运行”的地方。</p></div>${pill('当前没有真实连接','amber')}</div><div class="source-list"><div class="card source-card"><div class="source-top"><div class="source-icon">S</div><div style="flex:1"><strong>Shopify 开发店铺</strong><small>预期的外部真实数据源</small></div>${pill('待接入','amber')}</div><div class="source-meta"><div class="meta-line"><span>订单 API / Webhook</span><b>未配置</b></div><div class="meta-line"><span>访问与转化数据</span><b>权限待验证</b></div><div class="meta-line"><span>最近一次真实同步</span><b>无</b></div></div></div><div class="card source-card"><div class="source-top"><div class="source-icon">${I('database',23)}</div><div style="flex:1"><strong>PostgreSQL 数据仓库</strong><small>MetricSleuth 既有项目组件</small></div>${pill('原型未连接','neutral')}</div><div class="source-meta"><div class="meta-line"><span>指标计算</span><b>拟复用现有后端</b></div><div class="meta-line"><span>调查数据查询</span><b>需要集成</b></div><div class="meta-line"><span>当前展示内容</span><b>本地示例数据</b></div></div></div></div><div class="section-title">未来的真实数据流</div><section class="card"><div class="card-body"><div class="flow-steps"><div class="flow-box">${I('link',21)}<strong>店铺产生事件</strong><small>真实订单 / 定时查询</small></div><div class="flow-box">${I('database',21)}<strong>更新业务数据</strong><small>入库 / 计算指标</small></div><div class="flow-box">${I('search',21)}<strong>AI 查找问题</strong><small>工具调用 / 逐步检查</small></div><div class="flow-box">${I('file',21)}<strong>保留结果</strong><small>结论 / 原始证据</small></div></div><div class="notice" style="margin-top:20px">这个原型没有调用 Shopify、PostgreSQL 或 AI 模型。真正集成后，这页应能显示同步时间、同步错误、接入事件与查询记录，供用户核验数据确实在流动。</div></div></section><div class="section-title">示例操作记录</div><section class="card"><div class="card-body">${s.logs.map(l=>`<div class="log"><div><strong>${l.text}</strong> ${pill(l.kind,'blue')}</div><span>${l.time}</span></div>`).join('')}</div></section>`}
function lab(){return `<div class="page-head"><div><div class="eyebrow">INTERACTIVE SANDBOX</div><h2>体验实验室</h2><p>不用等待真实店铺发生异常，可以亲自改变示例指标，查看系统应该怎样响应。</p></div>${pill('隔离演示','blue')}</div><section class="card"><div class="card-head"><h3>第 1 步：选择一次业务变化</h3><span class="small muted">不会修改外部店铺</span></div><div class="card-body"><div class="scenario-grid"><button class="scenario ${s.pending==='conversion'?'active':''}" data-pending="conversion"><div class="scenario-icon">${I('chart',21)}</div><strong>下单转化率下降</strong><p>访客差不多，订单减少。AI 应该查转化率及影响范围。</p></button><button class="scenario ${s.pending==='traffic'?'active':''}" data-pending="traffic"><div class="scenario-icon">${I('chart',21)}</div><strong>访客量下降</strong><p>转化率稳定，流量突然减少。AI 应转向流量来源调查。</p></button><button class="scenario ${s.pending==='normal'?'active':''}" data-pending="normal"><div class="scenario-icon">${I('shield',21)}</div><strong>数据正常波动</strong><p>没有明显异常。AI 应及时停止，而不是硬找一个问题。</p></button></div><div style="display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-top:18px"><button class="btn primary" data-act="inject">${I('bolt')} 应用这次数据变化</button><span class="small muted">模拟改变当前页面使用的数据值，并写入演示记录</span></div></div></section><div class="section-title">第 2 步：让 AI 开始调查</div><section class="card"><div class="card-body"><div class="mini-row"><div class="record-icon">${I('search')}</div><div style="flex:1"><strong>当前场景：${current().title}</strong><div class="small muted">应用场景后，可以到概览页查看变化，也可以直接启动调查。</div></div><button class="btn primary" data-act="start">${I('spark')} 开始调查</button></div></div></section><div class="section-title">后续可接入的扩展</div><div class="grid-2"><div class="card"><div class="card-body"><div class="mini-row">${I('bolt',20)} <strong>Jev 决策实验</strong> ${pill('预留','neutral')}</div><p class="small muted">比较普通 LLM 与 Jev 选择下一步动作的准确率、开销和用时。当前原型没有调用 Jev。</p></div></div><div class="card"><div class="card-body"><div class="mini-row">${I('link',20)} <strong>Webhook 结果通知</strong> ${pill('预留','neutral')}</div><p class="small muted">调查完成后向其他系统发送结果，记录投递状态与失败原因。</p></div></div></div><div style="display:flex;justify-content:flex-end;margin-top:17px"><button class="btn light small" data-act="reset">${I('refresh',14)} 重置原型</button></div>`}
function modalHtml(){if(!s.modal)return '';const e=current().evidence[s.modal];return `<div class="modal-wrap" data-act="dismiss"><div class="modal" role="dialog" aria-modal="true" aria-label="数据来源示例"><div style="display:flex;justify-content:space-between;align-items:center"><h3>证据来源（设计示意）</h3><button class="btn small" data-act="close">${I('x',15)}</button></div><p class="muted small">${e[0]}：${e[1]}</p>${pill('示例记录 · 非真实 SQL','blue')}<code>工具：analytics.compare_metric\n指标：${s.scenario==='traffic'?'sessions':'conversion_rate'}\n范围：${current().scope}\n来源：prototype_fixture\n状态：原型展示，尚未连接查询引擎</code><p class="small muted">正式版本将展示真实 SQL/Tool 参数、时间范围、数据来源及可复查的查询结果。</p></div></div>`}
function render(){document.getElementById('app').innerHTML=`<div class="app">${nav()}<div class="main">${top()}<main class="content fade">${({overview,metrics,investigation,data:dataView,lab})[s.view]()}<div class="foot-notice">MetricSleuth · 可交互产品原型 · 全部示例数值仅用于演示 UI 和操作流程 · 无真实 AI / API / 数据库连接</div></main></div></div>${modalHtml()}`;}
function run(){if(s.run==='running'){s.view='investigation';render();return}clearInterval(timer);s.caseIndex=0;s.run='running';s.progress=0;s.trace=[];s.chat=[];s.view='investigation';s.runNumber++;const id=s.runNumber;render();timer=setInterval(()=>{if(id!==s.runNumber)return;s.progress++;if(s.progress>=current().steps.length){s.run='done';clearInterval(timer);s.logs.unshift({text:`完成调查：${current().title}`,kind:'演示',time:'刚刚'})}render()},1150)}
let timer=null;
function inject(){clearInterval(timer);s.runNumber++;s.scenario=s.pending;s.progress=0;s.run='idle';s.chat=[];s.caseIndex=0;s.logs.unshift({text:`应用示例业务事件：${current().title}`,kind:'模拟',time:'刚刚'});s.view='overview';render()}
function ask(msg){let p=current();s.chat.push({mine:true,text:escapeHTML(msg)});s.chat.push({mine:false,text:`演示答复：${s.scenario==='conversion'?'访客量只变化了 +0.8%，而下单转化率下降了 16.0%；因此这次调查优先关注转化变化。':s.scenario==='traffic'?'下单转化率基本稳定（+0.9%），但访客量下降了 15.1%，因此更值得优先检查流量来源。':'各指标变化较小，尚未达到示例场景中的异常标准，因此没有必要继续执行更多调查。'} 真实版本必须根据查询结果回答。`});render()}
function escapeHTML(str){return String(str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-act],[data-metric],[data-pending],[data-evidence],[data-case]');if(!el)return;if(el.dataset.go){s.view=el.dataset.go;s.caseIndex=el.dataset.case==='1'?1:0;render();return}if(el.dataset.metric){s.metric=el.dataset.metric;render();return}if(el.dataset.pending){s.pending=el.dataset.pending;render();return}if(el.dataset.evidence!==undefined){s.modal=Number(el.dataset.evidence);render();return}let act=el.dataset.act;switch(act){case 'start':run();break;case 'inject':inject();break;case 'cancel':clearInterval(timer);s.runNumber++;s.run='idle';s.progress=0;render();break;case 'backcase':s.caseIndex=0;render();break;case 'close':s.modal=null;render();break;case 'dismiss':if(e.target===el){s.modal=null;render()}break;case 'quickask':ask('为什么排除其他因素？');break;case 'ask':{const val=document.getElementById('ask-input')?.value?.trim();if(val)ask(val);break}case 'reset':clearInterval(timer);s.scenario='conversion';s.pending='conversion';s.run='idle';s.runNumber++;s.progress=0;s.chat=[];s.caseIndex=0;s.logs=[{text:'加载产品原型示例数据',time:'示例数据',kind:'演示'}];s.view='overview';render();break;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.modal!==null){s.modal=null;render()}if(e.key==='Enter'&&e.target?.id==='ask-input'&&s.run==='done'){const v=e.target.value.trim();if(v)ask(v)}});
render();
})();
</script>
</body>
</html>
